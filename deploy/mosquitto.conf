# Mosquitto for the Compose stack (D15): login and TLS on 8883 only, as in D6
# and D10. Files under /mosquitto/broker/ are copied, hashed and owned by the
# `broker-init` service, so no password is hashed on the host and no key is
# readable by anyone but the broker.
listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/broker/passwd
certfile /mosquitto/broker/broker.crt
keyfile /mosquitto/broker/broker.key
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
log_dest stdout
