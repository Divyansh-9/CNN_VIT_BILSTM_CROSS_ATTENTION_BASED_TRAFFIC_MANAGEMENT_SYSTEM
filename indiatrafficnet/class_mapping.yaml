# IDD Detection -> IndiaTrafficNet class mapping (S09, DATASETS §6, FR-D03)
#
# Versioned rather than remembered. This file is the single authority for how a
# public label becomes one of our eight, and `scripts/prepare_idd.py` reads it —
# it never hardcodes a name.
#
# Evidence for the mapping is `experiments/results/idd_label_census.csv`, a full
# enumeration of every <name> in every annotation, produced as DATASETS §6
# requires ("do not trust this table or any second-hand list").

target_classes:            # PRD §12.2, FR-D03. Order IS the YOLO class index.
  - car                    # 0
  - motorcycle             # 1
  - auto_rickshaw          # 2
  - e_rickshaw             # 3
  - bus                    # 4
  - truck                  # 5
  - pedestrian             # 6
  - cattle                 # 7

mapping:                   # IDD label -> our class, or null to DROP
  car: car
  motorcycle: motorcycle
  autorickshaw: auto_rickshaw
  bus: bus
  truck: truck
  person: pedestrian
  animal: cattle

  # --- deliberately dropped, each for a stated reason ---

  rider: null
  # DATASETS §6.1, decided. A motorcyclist is annotated as a `rider` ON a
  # `motorcycle`. Our task counts VEHICLES for congestion, so counting both
  # inflates every count by roughly the two-wheeler share — PRD §12.2 puts that
  # at ~30%, and it would bias every congestion label the §8.6 pipeline derives.
  # IndiaTrafficNet annotation must follow the same convention.

  bicycle: null
  # Not in the §12.2 taxonomy. Dropped rather than merged into motorcycle: a
  # bicycle's PCE is not a motorcycle's (ADR-012), so merging would corrupt the
  # saturation-flow arithmetic downstream as well as the class.

  vehicle fallback: null
  # IDD's catch-all for vehicles that fit no class. Mapping it anywhere teaches
  # the detector a category that does not exist in our label space; mapping it to
  # `car` would be worse, since it contains carts, tractors and trailers.

  traffic sign: null       # not a vehicle
  traffic light: null      # not a vehicle; the signal state is not perceived
  train: null              # 1 box in a 400-image sample. Out of scope
  caravan: null            # absent or negligible; listed so silence is deliberate
  trailer: null

# Classes with NO source in IDD. They are why self-collection is still required
# for the detector, not only for the corpus (DATASETS §4.4).
absent_from_idd:
  e_rickshaw: >
    No IDD label corresponds. NOR does the DataCluster Labs sample (DATASETS
    §4.5). No public source assessed so far contains this class at all.

    An earlier version of this note called that a "known, bounded" error. That
    was wrong and undersold it: bounded implies the size is known and tolerable,
    but if no public data carries the class, the bootstrap-era error is not
    bounded, it is TOTAL — the detector may never see a labelled e-rickshaw
    before deployment. Pending item P12 exists to resolve it rather than record
    it.

# P12 — an owner and a rule, not a note.
#
# The national trend does NOT support dropping the class: the Indian e-rickshaw
# market is growing at roughly 14% CAGR, Uttar Pradesh alone is ~38% of sales,
# and north India dominates. What IS happening in metros is enforcement —
# crackdowns on unregistered vehicles and restrictions on main arterials — which
# is very likely what "they are disappearing" describes. Both are true at once:
# restricted on big arterials, dominant on feeder routes and in tier-2/3 cities.
#
# So the question is not national, it is about THIS junction. And it is settled
# by the S06 recording rather than by opinion.
p12_e_rickshaw:
  status: OPEN
  decide_by: first S06 recording
  rule: >
    Count e-rickshaws in the first qualifying clip, over its full duration.

      >= 1% of vehicles  -> KEEP the class. Source it from IndiaTrafficNet
                            annotation; it is observable at the deployment site
                            and the taxonomy is right.
      <  1% of vehicles  -> PROPOSE dropping e_rickshaw to a 7-class taxonomy.
                            A class the deployment site never shows cannot be
                            evaluated: its per-class recall would be undefined
                            or computed from single digits, which FR-D08's
                            support requirement exists to prevent.

    Dropping is a graded change (PRD §12.2, FR-D03) and goes through the same
    sign-off queue as ADR-013/014/015. It is NOT taken unilaterally.
  bias_note: >
    The 1% threshold is fixed BEFORE the footage exists, for the same reason
    A28's statistic was: a cutoff chosen after seeing the count is a cutoff
    chosen to reach a preferred answer.
  siting_consequence: >
    If the class is kept, the filming site must be chosen so e-rickshaws are
    present — a feeder road or a tier-2 junction rather than a metro arterial.
    That is a decision about WHERE to film, and it has to be made before filming,
    not discovered afterwards.

# Sampling. IDD is a CAR-MOUNTED RIG; deployment is an elevated fixed camera
# (DATASETS §2, the viewpoint problem). Camera position is recorded per image, so
# stratifying by it costs nothing and is not a guess.
sampling:
  strategy: stratified_by_camera_position
  seed: 42
  weights:                 # relative sampling weight per camera position
    sideLeft: 1.0          # side-on view of cross traffic — nearest to an
    sideRight: 1.0         #   intersection approach, the deployment geometry
    highquality_16k: 1.0   # the best-annotated subset
    frontNear: 0.4         # pure forward dashcam — furthest from the target view
    frontFar: 0.4
    rearNear: 0.4
  note: >
    Weights are a stated prior, not a measurement. S12 tests them: fine-tune on a
    side-weighted subset and on a front-weighted one, and report the mAP gap on
    real junction footage. That turns the viewpoint gap into a measured number
    instead of an assertion, and if the gap is negligible these weights should be
    set to 1.0 everywhere and the claim withdrawn.

  # PARTIALLY UNDERCUT BY THE CENSUS, recorded before it is trained on.
  #
  # The full label census (experiments/results/idd_label_census.csv, 507,576
  # boxes) reports auto-rickshaw share by camera position:
  #
  #     highquality_16k   7.1%   (25,920 / 364,308 — 72% of ALL boxes)
  #     rearNear          6.5%
  #     sideLeft          4.5%
  #     sideRight         4.3%
  #     frontFar          4.2%
  #     frontNear         3.4%
  #
  # The side views are NOT richer in the class that matters most — 4.4% against
  # 3.8% for the front views is nearly nothing, and `highquality_16k` beats both
  # by a wide margin while already dominating by volume.
  #
  # So the up-weighting of side views can no longer rest on class composition. It
  # rests only on GEOMETRY — a side-on view of cross traffic resembles an
  # intersection approach more than a forward dashcam does — and geometry is
  # precisely what the census cannot measure. The prior is weaker than it was
  # written, and S12's test matters more, not less.
  #
  # The weights are left unchanged rather than quietly retuned: changing them now,
  # on evidence that speaks to a different question, would be the same
  # after-the-fact adjustment A28 was corrected for.
  #
  # S12 IS BLOCKED ON S06, and that dependency was not stated when this was
  # written. "Report the mAP gap on real junction footage" is not IDD data — it
  # is exactly the elevated fixed-camera footage the corpus track has been stuck
  # on. The detector track looked decoupled from S06 because TRAINING does not
  # need real footage; VALIDATING its one novel claim does. Left unsaid, the
  # detector track would appear to finish while S06 was open.
  #
  # Most of the question can be answered now, without any new footage, because
  # IDD is ALREADY a multi-viewpoint dataset. Six camera positions with different
  # geometry is a built-in cross-viewpoint benchmark:
  #
  #     train on sideLeft+sideRight  -> evaluate on frontNear+frontFar
  #     train on frontNear+frontFar  -> evaluate on sideLeft+sideRight
  #
  # If a detector transfers freely between IDD's own viewpoints, the premise that
  # viewpoint matters is already weak and the weights should go to 1.0. If it
  # drops sharply, the premise is supported and the size of the drop is a prior
  # on what elevated footage will cost. Neither settles the elevated case — the
  # geometry is different again — but it converts S12 from blocked to
  # PARTIALLY ANSWERABLE TODAY, and it costs only GPU time.
  s12_dependency:
    blocked_on: S06 footage — for the elevated fixed-camera half only
    answerable_now: cross-camera transfer within IDD (side <-> front)
    note: >
      Run the IDD cross-camera experiment first. It is free of the blocker, it
      tests the same hypothesis at lower fidelity, and if it shows no gap the
      elevated experiment may not be worth waiting for at all.
