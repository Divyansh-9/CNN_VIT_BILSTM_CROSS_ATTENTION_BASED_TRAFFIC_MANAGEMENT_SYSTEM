# PPO hyperparameters — PRD §13.1. SINGLE SOURCE OF TRUTH.
#
# NFR-16: no training script may hardcode a value that appears here. The three
# arms differ ONLY by config, so switching arms never edits code.

seed: 42                     # NFR-07 — PyTorch, NumPy, SB3

ppo:                         # PRD §13.1 verbatim
  learning_rate: 0.0003      # 3e-4
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  total_timesteps: 500000

env:
  episode_s: 1800            # 30 min per episode
  regime: saturated          # the measured capacity knee — see build_sumo_demand
  starvation_penalty: 1.0    # FR-R04. Longest-queue starves 4x under
                             # oversaturation; that is the weakness this penalty
                             # exists to make a learned policy avoid
  switch_penalty: 0.05       # discourages churn without forbidding adaptation
  lateral_resolution: 0.8    # ADR-010 sublane model, as run_episode applies it (P119)

arms:                        # ADR-009, as amended by ADR-021 Amendment 1
  no-forecast:
    use_mfstnet: false
    forecast: none
    note: >
      Indices 11-14 read absent (0.0) and the age reads 1.0 (ADR-020 as
      amended). The honest floor. Any claim that the forecast helps is measured
      against THIS.
  surrogate:
    use_mfstnet: false
    forecast: surrogate      # simulation.forecast_producer.Surrogate, --quality q
    # The oracle replays this frozen no-forecast policy (A1.2). It is refused
    # unless it is the full scenario-trained run and its requalification passed.
    frozen_policy: models/ppo/ppo_no-forecast_pulsed_keep_or_switch_seed42.zip
    requalification: experiments/results/scenario_pulsed/requalification.json
    quality_grid: [0.0, 0.25, 0.5, 0.75, 1.0]   # A1.3; 0 = persistence, 1 = oracle
    max_age_s: 10            # the gate's freshness bound; ages seen are 0, 5, 10 s
    tau_s: 60                # time constant of the informed chain (P115 §3)
    note: >
      ADR-021 A1.4. The replay oracle mixed with persistence at quality q.
      q = 1 is an UPPER BOUND, labelled oracle-input, never an achievable
      result. It is NOT evidence that MFSTNet helps.
  mfstnet:
    use_mfstnet: true
    forecast: mfstnet        # not runnable in SUMO: there are no frames
    note: >
      The real forecast in the loop. Phase 3 (PRD §2.4) — not before Phase 1
      converges.

benchmark:
  seeds: 30                  # FR-R07 — 30 evaluation runs per method
  bootstrap_resamples: 10000 # NFR-10 — mean +/- 95% CI
  alpha: 0.05                # paired t-test
