# Simulation scenarios beyond the three constant-rate regimes (P115).
#
# The regimes `light`, `saturated` and `oversaturated` are generated by
# scripts/build_sumo_demand.py and are NOT defined or changed here. A scenario
# is a distribution over demand schedules: one seed is one schedule plus one
# arrival realisation (PREREGISTRATION_P115.md §1).
#
# Bounds fixed by the pre-registration: levels within [300, 1200] veh/h per
# approach, 60 <= d_min <= d_max <= 600 s. Parameters change only during the
# design iterations on seeds 300-309, and are frozen before qualification.

pulsed:
  levels: [300, 700, 1100]     # veh/h/approach; design iteration 1
  d_min: 120                   # segment length, s
  d_max: 300
  schedule_rng_tag: 115        # numpy default_rng([seed, tag]); independent of SUMO's RNG
  duration_s: 3600             # schedule length; covers any 1800 s episode

# Training-episode seeds on a scenario are disjoint from every other seed use
# (P115 §4): offset + stride * training_seed + episode_index.
training_episode_seeds:
  offset: 1000000
  stride: 10000
