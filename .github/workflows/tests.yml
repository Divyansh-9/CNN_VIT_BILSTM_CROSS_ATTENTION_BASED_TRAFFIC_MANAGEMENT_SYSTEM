name: tests

# Two jobs, because the suites have genuinely different costs.
#
# The corpus, metrics, geometry and spec-invariant suites need no torch, no CUDA
# and no data — pure standard library plus pytest and pyyaml, running in seconds
# on every push.
#
# The model suites need torch and timm. They are the ONLY guard on amendment A24
# (the 49-vs-257 token mismatch that made the gate unexecutable) and on the
# per-lane ROI pooling A8 requires. They must not be skipped: `importorskip`
# means a torchless runner reports them as skipped, the job still passes, and the
# badge goes green over code nothing checked. Hence a job that installs torch,
# and `--no-skip-model` below to make a missing dependency a failure.

# NO path filter. A filtered workflow that does not run leaves the badge showing
# the PREVIOUS result — so a green badge can mean "never ran against this code",
# which is worse than a red one.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: fast suites (no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies only
        # Deliberately NOT requirements.txt — torch is ~2 GB and none of these
        # suites import it. Keeping this job dependency-light keeps it fast
        # enough that people actually read the result.
        #
        # python-pptx is here for a specific reason: the deck and progress-report
        # suites guard their geometry with `importorskip("pptx")`, so a runner
        # without it reports them as skipped and the job passes green over the
        # guards — the exact failure this workflow's header warns about for
        # torch. It is a ~500 KB pure-Python wheel, so there is no cost argument
        # for leaving it out. The `.docx` builders need no dependency at all;
        # they write OOXML directly.
        #
        # numpy, fastapi, pydantic and httpx (pinned as in requirements.txt)
        # for the same reason: the forecaster, calibration, server and
        # dashboard-evidence suites (P104-P110) are guards, and without these
        # they either fail to import or `importorskip` away. All four are
        # small pure-Python or prebuilt wheels.
        run: >
          pip install pytest pyyaml python-pptx numpy==2.5.2
          fastapi==0.141.1 pydantic==2.13.4 httpx==0.28.1

      - name: Run suites
        run: >
          pytest tests/ -q --tb=short
          --ignore=tests/test_encoders.py
          --ignore=tests/test_model.py
          --ignore=tests/test_cache.py
          --ignore=tests/test_sumo_network.py
          --ignore=tests/test_simulation.py
          --ignore=tests/test_checkpoint_guard.py
          --ignore=tests/test_video_sampling.py

      - name: Build the submitted documents and check them against the guidelines
        # The three documents are generated, never hand-edited, and the two
        # checkers read the produced `.docx` rather than the source — so the
        # only way to run them in CI is to build first. No `--pdf`: that drives
        # real Word and PowerPoint over COM and is Windows-only, and an
        # approximate PDF of a submitted document is worse than no PDF.
        #
        # This is what makes the guideline rules — A4 and the prescribed
        # margins, the chapter order, the 25-30 paper bound, captions and
        # equations cited in the text, citations matched in both directions,
        # and the rule that two of the three documents can quote no measured
        # result — hold on every push rather than when someone remembers.
        run: |
          python scripts/build_synopsis.py --which all --out-dir "$RUNNER_TEMP/docs"
          python scripts/check_synopsis.py \
            "$RUNNER_TEMP/docs/MFSTNet-Synopsis-Report.docx" \
            "$RUNNER_TEMP/docs/MFSTNet-Synopsis-Phase1.docx"
          python scripts/check_progress_report.py \
            "$RUNNER_TEMP/docs/MFSTNet-Phase1-Progress-Report-1.docx"

  model:
    name: model suites (CPU torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU torch and timm
        # CPU wheels only. There is no GPU on the runner and the model suites
        # assert geometry and gradient flow, which are device-independent.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install pytest pyyaml timm onnxruntime onnx psutil fastapi httpx paho-mqtt amqtt
          pip install gymnasium stable-baselines3
          pip install nbformat nbclient ipykernel pandas matplotlib
          pip install eclipse-sumo traci sumolib
          pip install opencv-python-headless

      - name: Fail if torch is missing rather than skipping
        # Without this the suites `importorskip` away and the job passes green
        # over completely untested code.
        run: python -c "import torch, timm; print(torch.__version__, timm.__version__)"

      - name: Run model suites
        # pretrained=False throughout: these assert geometry and gradient flow,
        # not representation quality, so downloading ~200 MB of backbone weights
        # every run would buy nothing.
        run: >
          pytest -q --tb=short
          tests/test_encoders.py tests/test_model.py tests/test_cache.py
          tests/test_spec_matches_code.py tests/test_sumo_network.py
          tests/test_simulation.py tests/test_checkpoints.py
          tests/test_edge_forecaster.py tests/test_mqtt_live.py
          tests/test_checkpoint_guard.py tests/test_video_sampling.py

      - name: Overfit check (S26)
        # The cheapest decisive test in the model track. A graph that cannot
        # memorise ten samples has a defect, and this catches it in a minute
        # rather than after a 14-hour training run. Kept short here; the full
        # eight-config sweep is a local command.
        run: python scripts/overfit_check.py --config E --steps 200 --sequences 4

      - name: Notebooks still run (notebooks/README.md)
        # --check executes without saving, so this proves the notebook works
        # against the current library and the current CSVs without creating a
        # diff on every run. A notebook whose stored output came from code that
        # no longer exists is worse than no notebook: it looks like evidence.
        run: python scripts/run_notebook.py notebooks/03_results.ipynb --check

  dashboard:
    # The read-only dashboard (P107). Its 12 tests pin that it is GET-only, that
    # a missing approach is never shown as zero or LOW, and the stale, invalid
    # and error states. A separate job so a Node problem cannot mask a Python one.
    name: dashboard (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install exactly the locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
