# Cross-cutting specification constants — SINGLE SOURCE OF TRUTH.
#
# These numbers appear in several documents and several subsystems. Defining
# them once and asserting their relationships in tests/test_spec_invariants.py
# is what stops the class of defect that produced PRD amendment A15: the corpus
# window arithmetic was stated correctly in three places and never added up.
#
# NFR-16: no training or pipeline script may hardcode a value that appears here.
# When one of these changes, amend the PRD, update this file, and run the tests.

sequence:
  T: 60                    # PRD §8.2 — timesteps per sample
  step_s: 5                # PRD §8.2 — spacing between sampled frames
  horizon_s: 60            # PRD §8.4 — forecast distance BEYOND the last observed frame
  stride_s: 30             # PRD §8.6 — spacing between successive window starts
  # Derived, asserted in tests — do not hand-edit:
  #   window_span_s = (T - 1) * step_s          = 295
  #   label_offset_s = window_span_s + horizon_s = 355
  #   min_clip_s     = label_offset_s            = 355  (protocol requires >= 360)
  min_clip_s: 360          # PRD §8.6 A15 — recording protocol minimum

congestion:                # PRD §14.1 — per-lane vehicle-count thresholds
  low_max: 4               # LOW  : count <  5
  med_max: 15              # MED  : 5 <= count <= 15 ; HIGH : count > 15
  classes: [LOW, MEDIUM, HIGH]   # canonical spelling — see TRIAGE-001 D1

lanes: [N, S, E, W]

ppo_state:                 # PRD §13.1 as amended by A16 (ADR-009)
  dim: 16
  index_map:
    count_N: 0
    count_S: 1
    count_E: 2
    count_W: 3
    queue_N: 4
    queue_S: 5
    queue_E: 6
    queue_W: 7
    phase_NS: 8
    phase_EW: 9
    phase_remaining: 10
    mfst_pred_N: 11
    mfst_pred_S: 12
    mfst_pred_E: 13
    mfst_pred_W: 14
    emergency_flag: 15
  normalisers:             # PRD §13.1 — revisit at W10, pending item P2
    count_divisor: 50
    queue_divisor: 200
    phase_remaining_divisor: 90
    mfst_pred_divisor: 2
  zero_when_mfstnet_unavailable: [11, 12, 13, 14]

signal:                    # PRD §9.6 — enforced by actuation, not learned
  min_green_s: 10
  max_green_s: 90
  all_red_s: 3
  starvation_s: 180        # FR-R04. See the note below — this is NOT in conflict
                           # with the cycle bounds; an earlier reading conflated
                           # cycle length with lane wait.
  green_durations_s: [10, 20, 30, 45, 60, 90]
  phases: [NS, EW]

  # Derived, asserted in tests:
  #   worst lane wait under strict alternation = max_green + 2*all_red = 96 s
  #     (a lane waits for the OTHER phase's green, not for a whole cycle)
  #   two repeated max greens                  = 189 s  -> penalised, as intended
  #   two repeated 60 s greens                 = 129 s  -> tolerated
  min_cycle_s: 26          # 2 * (min_green + all_red)  — Webster clamp floor
  max_cycle_s: 186         # 2 * (max_green + all_red)  — Webster clamp ceiling

  # P9 — UNDECIDED. May the controller serve the same phase twice in a row?
  # If false, starvation is structurally impossible and FR-R04 is dead code.
  # If true, the penalty is load-bearing. Set this explicitly; do not leave it
  # to whoever writes the environment first.
  phase_repetition_allowed: true

webster:                   # ADR-011 — baseline and edge fallback
  # Webster's optimum cycle C0 = (1.5L + 5) / (1 - Y) is clamped into
  # [min_cycle_s, max_cycle_s]. Every clamp is logged, and the clamp RATE is
  # reported beside the benchmark: a Webster that saturates its ceiling in most
  # cycles is being compared in an oversaturated regime, which weakens any
  # "PPO beats Webster" claim unless disclosed.
  clamp_cycle: true
  log_clamp_events: true
  report_clamp_rate: true

  # Split allocation after clamping: proportional to critical flow ratios, then
  # each split clamped to [min_green_s, max_green_s], then residual redistributed
  # proportionally among unclamped phases. If no feasible allocation exists, fall
  # back to an equal split and log it.
  split_rule: proportional_then_clamp_then_redistribute
  infeasible_split_fallback: equal

  # ADR-012. Saturation flow for non-lane-disciplined traffic is expressed PER
  # METRE OF APPROACH WIDTH, not per lane — lanes are not the unit of discharge
  # when two- and three-wheelers filter. The published range spans 2.4x, so the
  # baseline SWEEPS it and reports its best configuration. Picking one value is
  # indefensible in either direction.
  saturation_flow_pcu_per_hour_per_metre_sweep: [525, 600, 660, 750, 900, 1050, 1283]
  #   525  IRC:SP-41-1994 (Indian standard, stated valid above 5.5 m width)
  #   610-660  field studies, heterogeneous traffic, widths 3.5-14 m
  #   622  Banda Aceh calibrated, non-lane-based, R2=0.99, widths 5-8 m
  #   933-1283  Ahmedabad four-arm, using IRC PCU values
  saturation_flow_report: best_performing   # by mean wait time (the FR-R08 metric)
  narrow_width_form: "1020 + 459*We"        # if approach width below 5.5 m

  lost_time_s_startup_sweep: [0, 4, 5]      # some Indian field studies observe ~0:
                                            # queued two-wheelers move before green
  lost_time_s_clearance: 3                  # consistent with FR-A04 all-red

  pce:                     # passenger-car equivalents; also feed ADR-010 vTypes
    car: 1.00
    motorcycle: 0.24
    auto_rickshaw: 0.78
    # bus/truck: use IRC values and RECORD WHICH SET — the same intersection
    # yields 933W-1283W or 636W-821W purely by switching PCU convention

  # One implementation, two parameter files (ADR-011).
  shared_implementation: true
  params_benchmark: simulation/configs/webster_benchmark.yaml
  params_edge: edge/configs/webster_edge.yaml   # embedded at deploy time —
                                                # the fallback activates because
                                                # the network is down, so it can
                                                # never be fetched on demand

splits:
  detection: [0.70, 0.15, 0.15]   # FR-D05 — stratified by class
  mfstnet:   [0.60, 0.20, 0.20]   # PRD §8.4 — cut by SOURCE CLIP, never by sequence

seed: 42                   # NFR-07 — PyTorch, NumPy, SB3
